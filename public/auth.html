<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Authentication Redirect</title>
  <script>
    // Handle hash fragment
    if (window.location.hash) {
      // Store it in sessionStorage
      sessionStorage.setItem('auth_hash', window.location.hash);
    }
    
    // Redirect to the main app
    window.location.href = '/auth/callback';
  </script>
</head>
<body>
  <div style="display: flex; justify-content: center; align-items: center; height: 100vh; font-family: sans-serif;">
    <div style="text-align: center;">
      <div style="border: 4px solid #3498db; border-radius: 50%; width: 40px; height: 40px; margin: 0 auto; border-top-color: transparent; animation: spin 1s linear infinite;"></div>
      <p style="margin-top: 20px;">Redirecting...</p>
    </div>
  </div>
  
  <style>
    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
  </style>
</body>
</html>
